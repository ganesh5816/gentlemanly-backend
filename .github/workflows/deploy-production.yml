name: Deploy to Production Stage

on:
  push:
    branches: [develop] # Triggers when code is merged to develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Serverless Framework and Dependencies
        run: |
          npm install -g serverless@3.38.0 --no-fund
          echo "Serverless installed at: $(which serverless)"
          serverless --version
          npm install # Install project dependencies

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy to AWS Production Stage
        run: serverless deploy --stage prod

      - name: Deployment Success
        run: |
          echo "🚀 Deployment to production stage completed successfully!!"
          echo "Stage: production"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
